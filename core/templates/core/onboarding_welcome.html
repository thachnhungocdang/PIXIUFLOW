{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bắt đầu - Pixiu Flow</title>
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<main class="onboarding-shell">
    <section class="onboarding-panel">
        <div class="onboarding-brand">
            <img src="{% static 'core/images/pixiu_logo.png' %}" alt="Pixiu Flow">
            <span>PIXIU FLOW</span>
        </div>

        <div class="onboarding-hero">
            <div>
                <p class="onboarding-kicker">Thiết lập sau đăng ký</p>
                <h1>Cửa hàng bạn đang có hàng trong kho chưa?</h1>
                <p>Câu trả lời này giúp Pixiu Flow chọn đúng cách bắt đầu. Bạn vẫn có thể vào app ngay và bổ sung kho sau.</p>
            </div>
            <img src="{% static 'core/images/Pixiu_on_top.PNG' %}" alt="Pixiu">
        </div>

        <form method="post" class="onboarding-choice-form" id="stockChoiceForm">
            {% csrf_token %}
            <input type="hidden" name="has_stock" id="hasStockInput" value="">
            <button type="button" class="onboarding-choice" data-stock-choice="no">
                <i data-lucide="package-plus"></i>
                <span>
                    <strong>Chưa có</strong>
                    <small>Vào dashboard ngay. Khi bán hoặc nhập hàng, hệ thống sẽ nhắc bạn thêm kho.</small>
                </span>
            </button>
            <button type="button" class="onboarding-choice" data-stock-choice="yes">
                <i data-lucide="boxes"></i>
                <span>
                    <strong>Đã có</strong>
                    <small>Mở Opening Stock Wizard để khai báo hàng có sẵn, không tính vào chi phí kỳ này.</small>
                </span>
            </button>
        </form>
    </section>
</main>

<script>
(function () {
    const form = document.getElementById('stockChoiceForm');
    const input = document.getElementById('hasStockInput');
    document.querySelectorAll('[data-stock-choice]').forEach(button => {
        button.addEventListener('click', () => {
            document.querySelectorAll('[data-stock-choice]').forEach(item => item.classList.remove('is-selected'));
            button.classList.add('is-selected');
            input.value = button.dataset.stockChoice;
            window.setTimeout(() => form.submit(), 160);
        });
    });
    lucide.createIcons();
})();
</script>
</body>
</html>
